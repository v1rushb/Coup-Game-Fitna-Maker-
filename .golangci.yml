version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    misspell:
      locale: US
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - appendAssign
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    rules:
      # Tests may ignore errors from cleanup and best-effort writes.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
